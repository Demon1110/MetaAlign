[package]
name = "metaalign-gui"
description = "MetaAlign desktop UI (egui/eframe, WASM ready)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "MetaAlign"
path = "src/main.rs"

[dependencies]
metaalign-core = { path = "../metaalign-core" }
eframe = { workspace = true }
egui = { workspace = true }
egui_system_font_provider = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
env_logger = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

# 把 logo.ico 与版本信息烧进 Windows 可执行文件（资源管理器里的图标、属性页的版本号）
# 注意：build.rs 自身在宿主平台上编译，依赖不能按 target 门控，否则 Linux 上构建
# 会因为 build 脚本找不到这个 crate 而失败；资源生成仍只在 target_os=windows 时执行。
[build-dependencies]
winresource = "0.1"
