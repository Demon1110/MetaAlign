[workspace]
resolver = "3"
members = [
    "crates/metaalign-core",
    "crates/metaalign-gui",
    "crates/metaalign-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["MetaAlign contributors"]

[workspace.dependencies]
# ---- core ----
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "now"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
log = "0.4.35"
walkdir = "2.5.0"
quick-xml = "0.42.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
cfb = "0.16.0"
rand = "0.10.3"
encoding_rs = "0.8.44"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
filetime = "0.2.27"

# ---- gui ----
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "system_fonts"] }
egui = "0.37.0"
egui_system_font_provider = "0.37.0"
rfd = "0.18.0"
env_logger = "0.11.11"

# ---- wasm ----
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release.package."*"]
opt-level = 2
