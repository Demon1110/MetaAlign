# MetaAlign 发布流水线（手动触发）
#
#   在 Actions 页面点 "Run workflow"，流水线严格按下面顺序走：
#     1. prepare  只算版本号：按 bump 递增 Cargo.toml 的 [workspace.package].version，
#                 同步 Cargo.lock 里三个 workspace 成员的版本，把这两个文件上传成 artifact。
#                 ★ 这一步不提交、不 push、不打 tag。
#     2. checks   fmt --check / clippy -D warnings / 核心测试 / wasm 编译检查（都在新版本上跑）。
#     3. windows / linux 打包产物（zip / tar.gz / deb，各自附 sha256）。
#     4. publish  cargo package 校验 + 发布 metaalign-core 到 crates.io
#                 （仓库配了 CARGO_REGISTRY_TOKEN 才真发，没配就只做打包校验）。
#     5. release  ★ 全部发布成功后，才提交版本变更、打 tag、创建 GitHub Release。
#
#   失败语义（与「先提交再打包」相反，是刻意的）：
#     任何一步失败，分支上都不会留下「只改了版本号」的提交，也不会有 tag / Release；
#     重跑从当前 Cargo.toml 的版本继续递增，不会重号，crates.io 上也不会留下半个版本。
#
#   提交信息带 [skip ci]：本流水线目前只有手动触发，这个标记是给将来可能的 push 触发留的保险，
#   避免发版提交把自己再触发一遍。
#
#   版本号只有 Cargo.toml 一个来源，打包脚本自己解析，CI 不重复抄。
#   只发布 metaalign-core：GUI（eframe/GTK）与 wasm（wasm-bindgen）不适合进 crates.io。

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本递增方式
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

# 同一时间只允许一条发布流水线，避免两次触发把版本号撞在一起
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------- 1. 算版本号（只改工作区，不落库） ----------------
  prepare:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          KIND="${BUMP:-patch}"
          VER="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          IFS=. read -r MAJ MIN PAT <<< "$VER"
          case "$KIND" in
            major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN + 1)); PAT=0 ;;
            patch) PAT=$((PAT + 1)) ;;
            *) echo "::error::未知的递增方式 $KIND"; exit 1 ;;
          esac
          NV="$MAJ.$MIN.$PAT"
          echo "版本：$VER -> $NV"

          # tag 已存在就拒绝，避免覆盖已发布的版本
          if git rev-parse -q --verify "refs/tags/v$NV" >/dev/null; then
            echo "::error::tag v$NV 已存在，拒绝覆盖；请先删除该 tag 或改用更大的版本号"
            exit 1
          fi

          # [workspace.package] 只有一处行首 version，整行替换即可
          sed -i "s/^version = .*/version = \"$NV\"/" Cargo.toml
          # Cargo.lock 里三个 workspace 成员紧跟 name 的那行版本
          sed -i -E "/^name = \"metaalign-(core|gui|wasm)\"$/{n;s/^version = \"[^\"]*\"/version = \"$NV\"/;}" Cargo.lock

          git diff --stat
          git diff -- Cargo.lock

          {
            echo "version=$NV"
            echo "tag=v$NV"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 待发布版本：v$NV"
            echo ""
            echo "- 递增方式：\`$KIND\`（$VER -> $NV）"
            echo "- 该版本尚未提交、未打 tag；全部发布成功后才落库"
          } >> "$GITHUB_STEP_SUMMARY"

      # 后续 job 用同一份 Cargo.toml / Cargo.lock，保证全流水线版本一致
      - name: Upload bumped manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error

  # ---------------- 2. 质量门禁 ----------------
  checks:
    name: Checks (fmt / clippy / test)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use bumped manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: checks

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test -p metaalign-core

      # wasm 版不进 crates.io，但保证「可 WASM 化」这条线一直编译得过
      - name: Wasm check
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p metaalign-wasm --target wasm32-unknown-unknown

  # ---------------- 3a. Windows：release 构建 + zip ----------------
  windows:
    name: Windows x64
    needs: [prepare, checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use bumped manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      # 脚本内部：cargo build --release → 组装 dist\stage → Compress-Archive → 写 sha256
      - name: Package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package-windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaAlign-Windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  # ---------------- 3b. Linux：release 构建 + tar.gz / deb ----------------
  linux:
    name: Linux x86_64
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use bumped manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux

      # 构建只需要 gcc 与 pkg-config（GitHub 的 ubuntu 镜像自带）；GL/X11 是运行时 dlopen 的
      - name: Package
        run: bash scripts/package-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaAlign-Linux
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  # ---------------- 4. 打包校验 + 发布 crates.io ----------------
  publish:
    name: Publish to crates.io
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    # 有 token 才真发；没配 secret 时只做打包校验，tag / Release 照常继续
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Use bumped manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish

      # 不发布也要能打包成功：缺 description / license 之类的元数据会在这里就失败
      - name: Package verify
        run: cargo package -p metaalign-core --allow-dirty

      # --allow-dirty：版本号由 prepare 改在工作区里，此刻还没提交（提交在最后一步）
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p metaalign-core --allow-dirty

  # ---------------- 5. 全部成功后再提交、打 tag、发 Release ----------------
  release:
    name: Commit, tag, GitHub Release
    needs: [prepare, windows, linux, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use bumped manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Commit version bump
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME"

          git diff --stat
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "分支上已经是 v$VERSION，跳过提交"
          else
            git commit -m "chore(release): v$VERSION [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Create tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -lhR dist
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MetaAlign v$VERSION" \
            --generate-notes \
            dist/*

      - name: Summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "已发布 https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
